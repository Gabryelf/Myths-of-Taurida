<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAVRIDA · Icon Sheet v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0a0d12; --panel:#12161d; --panel2:#1a1f28; --border:#2a3038;
    --gold:#d4a94c; --gold-bright:#f5d57a; --text:#e8dfc8; --muted:#8a7a58;
    --red:#e74c3c; --green:#5ec37a; --blue:#7aa0c8; --purple:#c07ad8;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;-webkit-font-smoothing:antialiased}
  body{padding:24px 20px 80px;min-height:100vh}

  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(10,13,18,.98),rgba(10,13,18,.9));
    border-bottom:1px solid var(--border);
    padding:14px 20px;margin:-24px -20px 20px;
    backdrop-filter:blur(10px);
  }
  .head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;color:var(--gold-bright);letter-spacing:.06em;font-weight:700}
  h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
  .spacer{flex:1}
  .btn{
    padding:9px 18px;border-radius:var(--radius);cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;
    border:1px solid var(--gold);background:linear-gradient(180deg,#3a2a10,#1a1008);
    color:var(--gold-bright);transition:all .15s;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(245,213,122,.15);
  }
  .btn:hover{background:linear-gradient(180deg,#5a4020,#2a1a08);box-shadow:0 0 20px rgba(212,169,76,.45),inset 0 1px 0 rgba(245,213,122,.25)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#8a6a30,#4a3418)}
  .btn.primary:hover{background:linear-gradient(180deg,#a07c3a,#5a4020)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--border);box-shadow:none}
  .btn.ghost:hover{color:var(--gold-bright);border-color:var(--gold);box-shadow:none}

  .palette{display:none;gap:8px;flex-wrap:wrap;padding:12px 0 0;margin-top:12px;border-top:1px solid var(--border)}
  .palette.open{display:flex}
  .swatch{
    display:flex;align-items:center;gap:8px;padding:6px 10px;
    border:1px solid var(--border);border-radius:6px;cursor:pointer;
    background:var(--panel2);font-size:11px;transition:all .15s;
  }
  .swatch:hover{border-color:var(--gold);transform:translateY(-1px)}
  .swatch-color{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
  .swatch-hex{font-family:ui-monospace,'Courier New',monospace;color:var(--muted);font-size:11px}
  .swatch-name{color:var(--text);font-weight:700;font-size:11px}
  .copied{color:var(--green)!important}

  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:12px}
  .toolbar label{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}
  .seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px}
  .seg button{
    padding:4px 12px;border:none;background:transparent;color:var(--muted);
    font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;transition:all .15s;
  }
  .seg button.active{background:var(--gold);color:#1a1008;font-weight:700}
  .seg button:not(.active):hover{color:var(--gold-bright)}
  input[type=search]{
    padding:7px 14px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);font-family:inherit;font-size:12px;
    width:240px;outline:none;transition:border .15s;
  }
  input[type=search]:focus{border-color:var(--gold)}
  input[type=search]::placeholder{color:var(--muted)}

  .section{margin-bottom:32px}
  .section-title{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
    font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;
    padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .section-title .count{
    font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.04em;
    background:var(--panel);padding:2px 8px;border-radius:10px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}

  .ic{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:16px 8px 12px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);cursor:pointer;transition:all .2s;
    overflow:hidden;
  }
  .ic:hover{border-color:var(--gold);background:var(--panel2);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 1px rgba(212,169,76,.2)}
  .ic:active{transform:translateY(0)}

  .ic-preview{
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;transition:background .2s;
    position:relative;
  }
  .bg-dark .ic-preview{background:radial-gradient(circle at 50% 30%,#1a1f28,#0a0d12)}
  .bg-parchment .ic-preview{background:radial-gradient(circle at 50% 30%,#f0e4c8,#d8c8a0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .bg-checker .ic-preview{
    background:
      linear-gradient(45deg,#1a1f28 25%,transparent 25%),
      linear-gradient(-45deg,#1a1f28 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1f28 75%),
      linear-gradient(-45deg,transparent 75%,#1a1f28 75%);
    background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;
    background-color:#12161d;
  }
  .ic-preview svg{display:block;color:var(--text);overflow:visible}
  .bg-parchment .ic-preview svg{color:#2a1a08}

  .ic-key{
    font-family:ui-monospace,'Courier New',monospace;font-size:10px;color:var(--gold-bright);
    text-align:center;word-break:break-all;line-height:1.25;font-weight:600;
  }
  .ic-desc{font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
  .ic-dl{
    position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border);display:flex;
    align-items:center;justify-content:center;font-size:11px;color:var(--muted);
    opacity:0;transition:all .15s;
  }
  .ic:hover .ic-dl{opacity:1;color:var(--gold)}
  .ic-dl:hover{background:var(--gold);color:#1a1008;border-color:var(--gold)}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(180deg,#2a1d0f,#12100a);border:1px solid var(--gold);
    color:var(--gold-bright);padding:14px 28px;border-radius:var(--radius);
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;
    box-shadow:0 8px 32px rgba(0,0,0,.8),0 0 20px rgba(212,169,76,.3);z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--red);color:#f0a0a0;box-shadow:0 8px 32px rgba(0,0,0,.8),0 0 20px rgba(231,76,60,.3)}

  .progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:transparent;pointer-events:none}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .2s;box-shadow:0 0 10px var(--gold)}

  .legend{
    display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;margin-bottom:20px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    font-size:11px;color:var(--muted);
  }
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<header>
  <div class="head-row">
    <h1>⚔ TAVRIDA · Icon Sheet <small>v2 · 79 SVG · premium</small></h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnPalette">🎨 Палитра</button>
    <button class="btn" id="btnCsv">⬇ CSV-реестр</button>
    <button class="btn primary" id="btnZip">⬇ Скачать всё (ZIP)</button>
  </div>
  <div class="palette" id="palette"></div>
</header>

<div class="toolbar">
  <label>Фон:</label>
  <div class="seg" id="bgSeg">
    <button data-bg="dark" class="active">Тёмный</button>
    <button data-bg="parchment">Пергамент</button>
    <button data-bg="checker">Прозрачность</button>
  </div>
  <label>Размер:</label>
  <div class="seg" id="sizeSeg">
    <button data-size="32">32</button>
    <button data-size="48">48</button>
    <button data-size="64" class="active">64</button>
    <button data-size="96">96</button>
    <button data-size="128">128</button>
  </div>
  <div class="spacer"></div>
  <input type="search" id="search" placeholder="Поиск по ключу/описанию…">
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:#d4a94c"></span>Золото — акцент</div>
  <div class="legend-item"><span class="legend-dot" style="background:#e74c3c"></span>Урон / опасность</div>
  <div class="legend-item"><span class="legend-dot" style="background:#5ec37a"></span>Лечение / защита</div>
  <div class="legend-item"><span class="legend-dot" style="background:#7aa0c8"></span>Стрелки / тактика</div>
  <div class="legend-item"><span class="legend-dot" style="background:#c07ad8"></span>Спец / магия</div>
  <div class="legend-item"><span class="legend-dot" style="background:#e8dfc8"></span>currentColor (наследует)</div>
</div>

<main id="sheet"></main>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */

const G = '#d4a94c', GB = '#f5d57a', GD = '#8a6a30',
      R = '#e74c3c', RD = '#8b1a1a', GR = '#5ec37a', GRD = '#1e5a2c',
      B = '#7aa0c8', BD = '#2c4a6a', P = '#c07ad8', PD = '#5a2a6a',
      O = '#e67e22', ICE = '#8ad0ff';

/* Утилита: ромб */

  { key:'res_coins', cat:'Ресурсы', desc:'Монеты — ауреус', accent:G, svg:`

  { key:'general_capacity', cat:'Параметры', desc:'Вместимость — веер карт', accent:B, svg:`
    <defs>
      <linearGradient id="crd" x1="0" y1="0" x2="0" y2="1">

/* ═══════════════════════════════════════════════════════════════
   ПАЛИТРА
   ═══════════════════════════════════════════════════════════════ */
const PALETTE = [
  { name:'Фон',        hex:'#0a0d12' },
  { name:'Текст',      hex:'#e8dfc8' },
  { name:'Золото',     hex:'#d4a94c' },
  { name:'Золото ярк.',hex:'#f5d57a' },
  { name:'Урон',       hex:'#e74c3c' },
  { name:'Лечение',    hex:'#5ec37a' },
  { name:'Лучники',    hex:'#7aa0c8' },
  { name:'Спец',       hex:'#c07ad8' },
  { name:'Скифы',      hex:'#c0392b' },
  { name:'Боспор',     hex:'#2980b9' },
  { name:'Херсонес',   hex:'#d4a94c' },
  { name:'Рим',        hex:'#8b1a1a' },
  { name:'Готы',       hex:'#7f8c8d' },
  { name:'Тавры',      hex:'#8a4a2a' },
  { name:'Киммерийцы', hex:'#4a3a2a' },
];

const paletteEl = document.getElementById('palette');
paletteEl.innerHTML = PALETTE.map(p => `
  <div class="swatch" data-hex="${p.hex}">
    <span class="swatch-color" style="background:${p.hex}"></span>
    <span class="swatch-name">${p.name}</span>
    <span class="swatch-hex">${p.hex}</span>
  </div>
`).join('');
paletteEl.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  const hex = sw.getAttribute('data-hex');
  navigator.clipboard.writeText(hex).then(() => {
    const h = sw.querySelector('.swatch-hex');
    h.classList.add('copied');
    h.textContent = '✓ скопировано';
    setTimeout(() => { h.classList.remove('copied'); h.textContent = hex; }, 1200);
  });
});
document.getElementById('btnPalette').addEventListener('click', () => {
  paletteEl.classList.toggle('open');
});

/* ═══════════════════════════════════════════════════════════════
   РЕНДЕР
   ═══════════════════════════════════════════════════════════════ */
const sheet = document.getElementById('sheet');
let currentBg = 'dark', currentSize = 64, searchQuery = '';

function wrapSvg(svgContent) {
  return `<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>`;
}

function render() {
  const cats = {};
  for (const ic of ICONS) {
    if (!cats[ic.cat]) cats[ic.cat] = [];
    cats[ic.cat].push(ic);
  }
  let html = '';
  for (const [cat, list] of Object.entries(cats)) {
    const filtered = list.filter(ic => {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return ic.key.toLowerCase().includes(q) || ic.desc.toLowerCase().includes(q);
    });
    if (filtered.length === 0) continue;
    html += `<section class="section">
      <div class="section-title">${cat} <span class="count">${filtered.length}</span></div>
      <div class="grid">${filtered.map(ic => `
        <div class="ic" data-key="${ic.key}" title="Клик — скачать ${ic.key}.svg">
          <div class="ic-dl">⬇</div>
          <div class="ic-preview" style="width:${currentSize}px;height:${currentSize}px">
            ${wrapSvg(ic.svg)}
          </div>
          <div class="ic-key">${ic.key}</div>
          <div class="ic-desc">${ic.desc}</div>
        </div>
      `).join('')}</div>
    </section>`;
  }
  sheet.innerHTML = html || '<div style="text-align:center;color:#8a7a58;padding:60px">Ничего не найдено</div>';
  sheet.className = `bg-${currentBg}`;
  sheet.querySelectorAll('.ic-preview svg').forEach(svg => {
    svg.setAttribute('width', currentSize * 0.85);
    svg.setAttribute('height', currentSize * 0.85);
  });
  sheet.querySelectorAll('.ic').forEach(el => {
    el.addEventListener('click', () => downloadOne(el.getAttribute('data-key')));
  });
}

/* ═══════════════════════════════════════════════════════════════
   СКАЧИВАНИЕ
   ═══════════════════════════════════════════════════════════════ */
function svgToString(key) {
  const ic = ICONS.find(x => x.key === key);
  if (!ic) return null;
  return `<?xml version="1.0" encoding="UTF-8"?>\n${wrapSvg(ic.svg)}\n`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadOne(key) {
  const svg = svgToString(key);
  if (!svg) return;
  downloadBlob(new Blob([svg], { type: 'image/svg+xml' }), `${key}.svg`);
  toast(`✓ ${key}.svg`);
}

function buildCsv() {
  const head = ['key','filename','category','description','accent','viewBox','style_notes'];
  const STYLE = 'premium flat vector; layered with SVG gradients; stroke 2.4 outer + 1.2-1.8 detail; rounded caps/joins; currentColor + accent gradients; 32x32; transparent bg; antique/scythian motif; optical balance';
  const rows = ICONS.map(ic => [
    ic.key,
    ic.key + '.svg',
    ic.cat,
    ic.desc,
    ic.accent === 'currentColor' ? 'currentColor' : ic.accent,
    '0 0 32 32',
    STYLE,
  ]);
  return [head, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
}

document.getElementById('btnCsv').addEventListener('click', () => {
  const csv = '\uFEFF' + buildCsv();
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'tavrida-icons.csv');
  toast('✓ tavrida-icons.csv');
});

const progressBar = document.getElementById('progressBar');
function setProgress(p) { progressBar.style.width = (p*100) + '%'; setTimeout(()=>{ if(p>=1) progressBar.style.width='0'; }, 600); }

document.getElementById('btnZip').addEventListener('click', async () => {
  if (typeof JSZip === 'undefined') {
    toast('JSZip недоступен — скачиваю по одной', true);
    for (const ic of ICONS) { downloadOne(ic.key); await new Promise(r=>setTimeout(r,80)); }
    return;
  }
  const zip = new JSZip();
  const folder = zip.folder('icons');
  ICONS.forEach((ic, i) => {
    folder.file(`${ic.key}.svg`, svgToString(ic.key));
    setProgress((i+1)/ICONS.length * 0.9);
  });
  folder.file('tavrida-icons.csv', '\uFEFF' + buildCsv());
  folder.file('README.txt',
`TAVRIDA · Icon Set v2 (premium)
=================================
${ICONS.length} SVG · viewBox 0 0 32 32 · layered · SVG gradients

Подключение:
  1. Положить все *.svg в public/icons/
  2. Ничего в коде не менять — iconUrl('res_gold') → /icons/res_gold.svg

Стиль:
  - многослойные (подложка + контур + заливка + блик + детали)
  - SVG-градиенты (linearGradient / radialGradient)
  - currentColor для наследуемых штрихов
  - античный/скифский декор (меандр, солярные знаки)
  - 32×32, оптически сбалансированы

Цвета — из variables.css проекта.
`);
  toast('⏳ Собираю ZIP…');
  const blob = await zip.generateAsync({ type:'blob' }, meta => setProgress(0.9 + meta.percent/1000));
  setProgress(1);
  downloadBlob(blob, 'tavrida-icons-v2.zip');
  toast(`✓ tavrida-icons-v2.zip · ${ICONS.length} файлов`);
});

document.getElementById('bgSeg').addEventListener('click', e => {
  const btn = e.target.closest('[data-bg]');
  if (!btn) return;
  document.querySelectorAll('#bgSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentBg = btn.getAttribute('data-bg');
  render();
});

document.getElementById('sizeSeg').addEventListener('click', e => {
  const btn = e.target.closest('[data-size]');
  if (!btn) return;
  document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSize = parseInt(btn.getAttribute('data-size'), 10);
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

let toastTimer;
function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

render();
</script>
