<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAVRIDA · Icon Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0a0d12; --panel:#12161d; --panel2:#1a1f28; --border:#2a3038;
    --gold:#d4a94c; --gold-bright:#f5d57a; --text:#e8dfc8; --muted:#8a7a58;
    --red:#e74c3c; --green:#5ec37a; --blue:#7aa0c8; --purple:#c07ad8;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;-webkit-font-smoothing:antialiased}
  body{padding:24px 20px 80px;min-height:100vh}

  /* ─── Шапка ─── */
  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(10,13,18,.98),rgba(10,13,18,.92));
    border-bottom:1px solid var(--border);
    padding:14px 20px;margin:-24px -20px 20px;
    backdrop-filter:blur(8px);
  }
  .head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;color:var(--gold-bright);letter-spacing:.06em;font-weight:700}
  h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
  .spacer{flex:1}
  .btn{
    padding:8px 16px;border-radius:var(--radius);cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;
    border:1px solid var(--gold);background:linear-gradient(180deg,#3a2a10,#1a1008);
    color:var(--gold-bright);transition:all .15s;white-space:nowrap;
  }
  .btn:hover{background:linear-gradient(180deg,#5a4020,#2a1a08);box-shadow:0 0 16px rgba(212,169,76,.4)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#8a6a30,#4a3418)}
  .btn.primary:hover{background:linear-gradient(180deg,#a07c3a,#5a4020)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--border)}
  .btn.ghost:hover{color:var(--gold-bright);border-color:var(--gold)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ─── Палитра ─── */
  .palette{
    display:none;gap:8px;flex-wrap:wrap;padding:12px 0 0;margin-top:12px;
    border-top:1px solid var(--border);
  }
  .palette.open{display:flex}
  .swatch{
    display:flex;align-items:center;gap:8px;padding:6px 10px;
    border:1px solid var(--border);border-radius:6px;cursor:pointer;
    background:var(--panel2);font-size:11px;transition:all .15s;
  }
  .swatch:hover{border-color:var(--gold);transform:translateY(-1px)}
  .swatch-color{width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
  .swatch-hex{font-family:ui-monospace,'Courier New',monospace;color:var(--muted);font-size:11px}
  .swatch-name{color:var(--text);font-weight:700;font-size:11px}
  .copied{color:var(--green)!important}

  /* ─── Тулбар ─── */
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:12px}
  .toolbar label{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}
  .seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px}
  .seg button{
    padding:4px 10px;border:none;background:transparent;color:var(--muted);
    font-family:inherit;font-size:11px;cursor:pointer;border-radius:4px;transition:all .15s;
  }
  .seg button.active{background:var(--gold);color:#1a1008;font-weight:700}
  .seg button:not(.active):hover{color:var(--gold-bright)}
  input[type=search]{
    padding:6px 12px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);font-family:inherit;font-size:12px;
    width:220px;outline:none;transition:border .15s;
  }
  input[type=search]:focus{border-color:var(--gold)}
  input[type=search]::placeholder{color:var(--muted)}

  /* ─── Секции ─── */
  .section{margin-bottom:28px}
  .section-title{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
    font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;
    padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .section-title .count{
    font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.04em;
    background:var(--panel);padding:2px 8px;border-radius:10px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}

  /* ─── Карточка иконки ─── */
  .ic{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:14px 8px 10px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);cursor:pointer;transition:all .15s;
    overflow:hidden;
  }
  .ic:hover{border-color:var(--gold);background:var(--panel2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .ic:active{transform:translateY(0)}
  .ic-preview{
    width:64px;height:64px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:background .15s;
  }
  /* Фоны для превью */
  .bg-dark .ic-preview{background:#0a0d12}
  .bg-gold .ic-preview{background:radial-gradient(circle at 50% 40%,#3a2a10,#1a1008)}
  .bg-checker .ic-preview{
    background:
      linear-gradient(45deg,#1a1f28 25%,transparent 25%),
      linear-gradient(-45deg,#1a1f28 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1f28 75%),
      linear-gradient(-45deg,transparent 75%,#1a1f28 75%);
    background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;
    background-color:#12161d;
  }
  .ic-preview svg{display:block;color:var(--text)}
  .ic-key{
    font-family:ui-monospace,'Courier New',monospace;font-size:10px;color:var(--gold-bright);
    text-align:center;word-break:break-all;line-height:1.2;
  }
  .ic-desc{font-size:10px;color:var(--muted);text-align:center;line-height:1.25}
  .ic-dl{
    position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border);display:flex;
    align-items:center;justify-content:center;font-size:11px;color:var(--muted);
    opacity:0;transition:all .15s;
  }
  .ic:hover .ic-dl{opacity:1;color:var(--gold)}
  .ic-dl:hover{background:var(--gold);color:#1a1008;border-color:var(--gold)}

  /* ─── Тосты ─── */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(180deg,#2a1d0f,#12100a);border:1px solid var(--gold);
    color:var(--gold-bright);padding:12px 24px;border-radius:var(--radius);
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;
    box-shadow:0 8px 32px rgba(0,0,0,.8);z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--red);color:#f0a0a0}

  /* ─── Прогресс ─── */
  .progress{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
    background:transparent;pointer-events:none;
  }
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .2s}
</style>
</head>
<body>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<header>
  <div class="head-row">
    <h1>🎨 TAVRIDA · Icon Sheet <small>79 SVG · 32×32 · currentColor</small></h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnPalette">🎨 Палитра</button>
    <button class="btn" id="btnCsv">⬇ CSV-реестр</button>
    <button class="btn primary" id="btnZip">⬇ Скачать всё (ZIP)</button>
  </div>
  <div class="palette" id="palette"></div>
</header>

<div class="toolbar">
  <label>Фон:</label>
  <div class="seg" id="bgSeg">
    <button data-bg="dark" class="active">Тёмный</button>
    <button data-bg="gold">Золотой</button>
    <button data-bg="checker">Шахматка</button>
  </div>
  <label>Размер:</label>
  <div class="seg" id="sizeSeg">
    <button data-size="32">32</button>
    <button data-size="48">48</button>
    <button data-size="64" class="active">64</button>
    <button data-size="96">96</button>
  </div>
  <div class="spacer"></div>
  <input type="search" id="search" placeholder="Поиск по ключу/описанию…">
</div>

<main id="sheet"></main>

<div class="toast" id="toast"></div>

<script>

  { name:'Золото ярк.',hex:'#f5d57a' },
  { name:'Урон',       hex:'#e74c3c' },
  { name:'Лечение',    hex:'#5ec37a' },
  { name:'Лучники',    hex:'#7aa0c8' },
  { name:'Спец',       hex:'#c07ad8' },
  { name:'Скифы',      hex:'#c0392b' },
  { name:'Боспор',     hex:'#2980b9' },
  { name:'Херсонес',   hex:'#d4a94c' },
  { name:'Рим',        hex:'#8b1a1a' },
  { name:'Готы',       hex:'#7f8c8d' },
  { name:'Тавры',      hex:'#8a4a2a' },
  { name:'Киммерийцы', hex:'#4a3a2a' },
];

const paletteEl = document.getElementById('palette');
paletteEl.innerHTML = PALETTE.map(p => `
  <div class="swatch" data-hex="${p.hex}">
    <span class="swatch-color" style="background:${p.hex}"></span>
    <span class="swatch-name">${p.name}</span>
    <span class="swatch-hex">${p.hex}</span>
  </div>
`).join('');
paletteEl.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  const hex = sw.getAttribute('data-hex');
  navigator.clipboard.writeText(hex).then(() => {
    const h = sw.querySelector('.swatch-hex');
    h.classList.add('copied');
    h.textContent = '✓ скопировано';
    setTimeout(() => { h.classList.remove('copied'); h.textContent = hex; }, 1200);
  });
});
document.getElementById('btnPalette').addEventListener('click', () => {
  paletteEl.classList.toggle('open');
});

/* ═══════════════════════════════════════════════════════════════
   РЕНДЕР
   ═══════════════════════════════════════════════════════════════ */
const sheet = document.getElementById('sheet');
let currentBg = 'dark', currentSize = 64, searchQuery = '';

function wrapSvg(svgContent) {
  return `<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>`;
}

function render() {
  // группируем по категориям
  const cats = {};
  for (const ic of ICONS) {
    if (!cats[ic.cat]) cats[ic.cat] = [];
    cats[ic.cat].push(ic);
  }
  let html = '';
  for (const [cat, list] of Object.entries(cats)) {
    const filtered = list.filter(ic => {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return ic.key.toLowerCase().includes(q) || ic.desc.toLowerCase().includes(q);
    });
    if (filtered.length === 0) continue;
    html += `<section class="section">
      <div class="section-title">${cat} <span class="count">${filtered.length}</span></div>
      <div class="grid">${filtered.map(ic => `
        <div class="ic" data-key="${ic.key}" title="Клик — скачать ${ic.key}.svg">
          <div class="ic-dl">⬇</div>
          <div class="ic-preview" style="width:${currentSize}px;height:${currentSize}px">
            ${wrapSvg(ic.svg)}
          </div>
          <div class="ic-key">${ic.key}</div>
          <div class="ic-desc">${ic.desc}</div>
        </div>
      `).join('')}</div>
    </section>`;
  }
  sheet.innerHTML = html || '<div style="text-align:center;color:#8a7a58;padding:60px">Ничего не найдено</div>';
  sheet.className = `bg-${currentBg}`;
  // адаптируем размер svg внутри превью
  sheet.querySelectorAll('.ic-preview svg').forEach(svg => {
    svg.setAttribute('width', currentSize * 0.75);
    svg.setAttribute('height', currentSize * 0.75);
  });
  // клики
  sheet.querySelectorAll('.ic').forEach(el => {
    el.addEventListener('click', () => downloadOne(el.getAttribute('data-key')));
  });
}

/* ═══════════════════════════════════════════════════════════════
   СКАЧИВАНИЕ
   ═══════════════════════════════════════════════════════════════ */
function svgToString(key) {
  const ic = ICONS.find(x => x.key === key);
  if (!ic) return null;
  return `<?xml version="1.0" encoding="UTF-8"?>\n${wrapSvg(ic.svg)}\n`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadOne(key) {
  const svg = svgToString(key);
  if (!svg) return;
  downloadBlob(new Blob([svg], { type: 'image/svg+xml' }), `${key}.svg`);
  toast(`✓ ${key}.svg`);
}

/* ─── CSV ─── */
function buildCsv() {
  const head = ['key','filename','category','description','accent','viewBox','style_notes'];
  const STYLE = 'flat vector; stroke 2.4 (or 2.2 detail); rounded caps/joins; currentColor strokes; accent fill; 32x32; transparent bg; antique/scythian motif';
  const rows = ICONS.map(ic => [
    ic.key,
    ic.key + '.svg',
    ic.cat,
    ic.desc,
    ic.accent === 'currentColor' ? 'currentColor' : ic.accent,
    '0 0 32 32',
    STYLE,
  ]);
  return [head, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
}

document.getElementById('btnCsv').addEventListener('click', () => {
  const csv = '\uFEFF' + buildCsv();  // BOM для Excel
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'tavrida-icons.csv');
  toast('✓ tavrida-icons.csv');
});

/* ─── ZIP ─── */
const progressBar = document.getElementById('progressBar');
function setProgress(p) { progressBar.style.width = (p*100) + '%'; setTimeout(()=>{ if(p>=1) progressBar.style.width='0'; }, 600); }

document.getElementById('btnZip').addEventListener('click', async () => {
  if (typeof JSZip === 'undefined') {
    toast('JSZip недоступен — скачиваю по одной', true);
    for (const ic of ICONS) { downloadOne(ic.key); await new Promise(r=>setTimeout(r,80)); }
    return;
  }
  const zip = new JSZip();
  const folder = zip.folder('icons');
  ICONS.forEach((ic, i) => {
    folder.file(`${ic.key}.svg`, svgToString(ic.key));
    setProgress((i+1)/ICONS.length * 0.9);
  });
  folder.file('tavrida-icons.csv', '\uFEFF' + buildCsv());
  folder.file('README.txt',
`TAVRIDA · Icon Set
=================
${ICONS.length} SVG · viewBox 0 0 32 32 · stroke 2.4 · currentColor

Подключение в проекте:
  Положить все *.svg в public/icons/
  Ничего в коде менять не нужно — iconUrl('res_gold') уже даёт /icons/res_gold.svg

Цвета акцентов — из variables.css проекта.
Стиль: flat vector, antique/scythian motif, gold #d4a94c accent.
`);
  toast('⏳ Собираю ZIP…');
  const blob = await zip.generateAsync({ type:'blob' }, meta => setProgress(0.9 + meta.percent/1000));
  setProgress(1);
  downloadBlob(blob, 'tavrida-icons.zip');
  toast(`✓ tavrida-icons.zip · ${ICONS.length} файлов`);
});

/* ═══════════════════════════════════════════════════════════════
   ТУЛБАР
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('bgSeg').addEventListener('click', e => {
  const btn = e.target.closest('[data-bg]');
  if (!btn) return;
  document.querySelectorAll('#bgSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentBg = btn.getAttribute('data-bg');
  render();
});

document.getElementById('sizeSeg').addEventListener('click', e => {
  const btn = e.target.closest('[data-size]');
  if (!btn) return;
  document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSize = parseInt(btn.getAttribute('data-size'), 10);
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

/* ═══════════════════════════════════════════════════════════════
   ТОСТ
   ═══════════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════════════════════
   СТАРТ
   ═══════════════════════════════════════════════════════════════ */
render();
</script>
